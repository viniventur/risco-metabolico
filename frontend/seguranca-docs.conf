# Cabeçalhos das rotas servidas pela API através do nginx (/docs e /openapi.json): os mesmos de
# seguranca.conf, SEM a Content-Security-Policy do app — a página do Swagger UI que o FastAPI gera
# carrega o próprio JS e CSS de um CDN e tem um script em linha; a CSP do app a deixaria em branco.
# Nenhum dado do produto passa por /docs: é documentação pública do contrato.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
