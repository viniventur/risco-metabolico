# Cabeçalhos de segurança de todas as respostas do app (incluído pelo nginx.conf).
# "always" também vale para as respostas de erro.
#
# A mesma política que frontend/vercel.json declarava, agora servida pelo nginx: tudo do próprio
# site. 'unsafe-inline' em style-src é exigido pelo Plotly e pelo Recharts (estilos em linha); as
# fontes do KaTeX e os PNG do notebook são do próprio site (font-src/img-src 'self' data:).
# connect-src 'self': a API está na MESMA origem (proxy /api/ do nginx.conf) — sem CORS em produção.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Só vale em HTTPS (em HTTP o navegador ignora): na VPS, o Caddy entrega a página em HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
