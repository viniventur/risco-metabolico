<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Triagem Metabólica: distribuição de probabilidade entre 7 faixas de composição corporal e risco acumulado, a partir de 16 respostas. Dados fictícios; triagem, não diagnóstico." />
    <meta name="author" content="Vinícius Ventura" />
    <meta name="color-scheme" content="light dark" />
    <!-- Barra do navegador no celular: o papel no claro e o fundo do escuro (tokens.css). -->
    <meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a19" media="(prefers-color-scheme: dark)" />
    <!-- Prévia do link (Open Graph). Sem og:image: ela exige endereço absoluto, que só existe no deploy. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Triagem Metabólica" />
    <meta property="og:description" content="16 respostas viram a distribuição entre 7 faixas de composição corporal e um risco acumulado. Dados fictícios; triagem, não diagnóstico." />
    <title>Triagem Metabólica</title>
    <!-- Ícones da marca Visor (manual 1.0): o SVG com a versão reduzida, o ICO para quem não lê SVG, o
         ícone de toque com fundo (iOS) e o manifesto com os de 192 e 512 px. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Tema antes da hidratação. Arquivo do próprio site: a CSP de produção é script-src 'self'. -->
    <script src="/tema-inicial.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
