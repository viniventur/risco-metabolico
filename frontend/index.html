<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Triagem Metabólica: distribuição de probabilidade entre 7 faixas de composição corporal e risco acumulado, a partir de 16 respostas. Dados fictícios; triagem, não diagnóstico." />
    <meta name="color-scheme" content="light dark" />
    <title>Triagem Metabólica</title>
    <script>
      // Tema antes da hidratação, para não piscar branco: data-theme no <html> +
      // prefers-color-scheme; localStorage em try/catch (modo privado, dados bloqueados).
      (function () {
        var tema = null;
        try { tema = localStorage.getItem("tema"); } catch (e) { tema = null; }
        if (tema !== "light" && tema !== "dark") {
          tema = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", tema);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
