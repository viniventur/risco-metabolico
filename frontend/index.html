<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Triagem Metabólica: duas triagens de demonstração — obesidade (16 respostas, 7 faixas de composição corporal e risco acumulado, dados fictícios) e diabetes (10 respostas, probabilidade e limiar, respostas reais e anonimizadas do BRFSS 2015). Triagem, não diagnóstico." />
    <meta name="author" content="Vinícius Ventura" />
    <meta name="color-scheme" content="light dark" />
    <!-- Barra do navegador no celular: o papel no claro e o fundo do escuro (tokens.css). -->
    <meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a19" media="(prefers-color-scheme: dark)" />
    <!-- Endereço de produção (o SITE_URL do deploy, docs/deploy-vps.md). A prévia do link (Open Graph)
         precisa de endereço absoluto: a imagem é public/og-imagem.png, 1200 × 630. -->
    <link rel="canonical" href="https://triagem-metabolica.viniciusventura.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Triagem Metabólica" />
    <meta property="og:url" content="https://triagem-metabolica.viniciusventura.com.br/" />
    <meta property="og:title" content="Triagem Metabólica" />
    <meta property="og:description" content="Duas triagens: 16 respostas viram 7 faixas de composição corporal e um risco acumulado (dados fictícios); 10 respostas viram a probabilidade de diabetes contra um limiar (respostas reais e anonimizadas do BRFSS 2015). Triagem, não diagnóstico." />
    <meta property="og:image" content="https://triagem-metabolica.viniciusventura.com.br/og-imagem.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O símbolo Visor ao lado do nome Triagem Metabólica, sobre o visor de uma balança." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Triagem Metabólica</title>
    <!-- Ícones da marca Visor (manual 1.0): o SVG com a versão reduzida, o ICO para quem não lê SVG, o
         ícone de toque com fundo (iOS) e o manifesto com os de 192 e 512 px. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Tema antes da hidratação. Arquivo do próprio site: a CSP de produção é script-src 'self'. -->
    <script src="/tema-inicial.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
