# Incluído dentro do bloco http do nginx.conf da imagem nginx-unprivileged.
#
# O front e a API ficam na MESMA origem: o nginx serve o build do Vite e repassa /api/, /docs e
# /openapi.json para o contêiner da API. Sem CORS em produção; o proxy do Vite continua desligado
# em desenvolvimento, de propósito (vite.config.ts), para o CORS ser testado contra o backend local.

# ---- Limite de consultas por IP (segunda camada; a API já limita /predicoes* por chave) -------
# O painel dispara perto de 12 chamadas por troca de filtro: taxa e rajada com folga para isso.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level info;

# ---- Endereço da API -------------------------------------------------------------------------
# O nome "api" é resolvido pelo DNS do Docker a cada 10 s, não uma vez só quando o nginx sobe: um
# deploy que recria só a API a sobe com outro IP, e com o IP guardado o nginx responderia 502.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Nenhum registro de acesso: o produto não guarda IP em lugar nenhum (plano, risco 21). Erros do
  # próprio nginx continuam no stderr do contêiner (docker compose logs web).
  access_log off;

  # IP real de quem acessa, só quando o pedido chega por rede privada (o Caddy da VPS). Serve ao
  # limite de consultas acima; nada disso é gravado.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /usr/share/nginx/html;
  index index.html;

  # Um add_header dentro de um location anula os herdados do server: por isso o arquivo de
  # cabeçalhos é incluído de novo em cada location que tem add_header próprio.
  include /etc/nginx/seguranca.conf;

  # Com variável, o nginx resolve o nome a cada pedido (pelo resolver acima, com cache de 10 s).
  set $api http://api:8000;

  # /api/v1/* -> API, com o caminho intacto (o prefixo /api/v1 é da própria API; não há rewrite).
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    error_page 429 = @muitas_consultas;

    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Documentação interativa e o contrato OpenAPI, gerados pela API.
  location = /docs {
    include /etc/nginx/seguranca-docs.conf;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /openapi.json {
    include /etc/nginx/seguranca-docs.conf;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Resposta do limite no envelope de erro da própria API ({erro, mensagem, detalhes}), para o
  # simulador mostrar a faixa de aviso com os segundos, nunca um laço de retentativa.
  location @muitas_consultas {
    include /etc/nginx/seguranca.conf;
    add_header Retry-After 60 always;
    default_type application/json;
    return 429 '{"erro":"limite_de_taxa","mensagem":"Muitas consultas seguidas. Tente de novo em 60s.","detalhes":{"retry_after_s":60}}';
  }

  # Arquivos gerados pelo Vite têm hash no nome: cache longo é seguro.
  location /assets/ {
    include /etc/nginx/seguranca.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Módulo Estudos: JSON, PNG e CSS gerados por tools/nb2json.py, estáticos e cacheáveis (§8.3).
  location /study/ {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # As telas do app (src/routes.tsx) abrem o index.html. Ele nunca fica em cache sem revalidar:
  # senão o navegador guardaria uma versão antiga apontando para pacotes JS que já não existem.
  # /diabetes e as três telas dela são a vertente diabetes (decisão D5).
  location ~ ^/(painel|consulta|simulador|monitoramento|privacidade|estudos(/[a-z0-9-]+)?|diabetes(/(consulta|simulador|monitoramento))?)?$ {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # O manifesto do app (ícones da marca Visor). O mime.types da imagem não conhece .webmanifest e o
  # serviria como application/octet-stream; default_type só vale para o que o mapa não conhece.
  location = /site.webmanifest {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # Demais arquivos da pasta public. Endereço que não existe responde 404 com o próprio app, que
  # mostra a tela "página não encontrada".
  location / {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
    error_page 404 /index.html;
  }
}
