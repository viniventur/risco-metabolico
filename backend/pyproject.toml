[project]
name = "risco-metabolico-backend"
version = "2.0.0"
description = "API de triagem metabólica: contrato de predição, painel servido de memória, log de predição e monitoramento de deriva."
requires-python = ">=3.12"
authors = [{ name = "Vinícius Ventura" }]
license = { text = "MIT" }
# Versões fixadas: resolvidas por `uv lock` e pinadas aqui com ==. O pyarrow é pinado
# por exigência do plano (4.3.6): subir a versão muda os bytes do snapshot e, com
# eles, o versao_dados do manifest.
dependencies = [
  "fastapi==0.143.3",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "numpy==2.5.4",
  # pandas 3 muda o dtype padrao de texto (str em vez de object) e quebra o
  # select_dtypes(include=['object']) do notebook de estudo; fica na linha 2.x.
  "pandas>=2.3,<3",
  "pyarrow==26.0.0",
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
  "imbalanced-learn==0.14.2",
  "joblib==1.6.0",
  "asyncpg==0.32.0",
  "slowapi==0.1.10",
]

[project.optional-dependencies]
# `operacao`: só o driver síncrono, para a imagem publicada rodar o seed, a conferência do schema e a
# carga da referência de deriva na VPS (scripts/deploy.sh) sem carregar as dependências de treino.
operacao = ["psycopg[binary]==3.3.6"]
treino = ["psycopg[binary]==3.3.6", "lightgbm==4.7.0"]
estudo = [
  "jupyter==1.1.1",
  "nbconvert==7.17.2",
  "nbformat==5.11.1",
  "ipykernel==7.4.0",
  "seaborn==0.13.2",
  "matplotlib==3.11.2",
  "plotly==7.1.0",
  "pygments==2.21.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "sqlfluff==4.4.0",
  "nbformat==5.11.1",
  "pygments==2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D"]
# D203/D213: incompatíveis com D211/D212 da convenção Google. ANN401: `Any` é legítimo para
# cargas JSON genuinamente dinâmicas (detalhes de erro, jsonb do log).
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "latencia: mede desempenho, nao roda no CI",
  "banco: exige BANCO_URL; pulado quando a variavel nao existe",
]
addopts = "-m 'not latencia'"
